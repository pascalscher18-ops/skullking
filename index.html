<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Skull King</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f6f1e7;--fg:#2b2118;--card:#fff;--ac:#a4262c;--mu:#7a6a58;--bd:#d9ccb8}
@media(prefers-color-scheme:dark){:root{--bg:#1a1511;--fg:#f1e8da;--card:#2a221b;--ac:#e0565c;--mu:#a8957f;--bd:#4a3d31}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{margin:0 0 8px;font-size:22px}h2{font-size:17px;margin:14px 0 6px}
button,input{font:inherit;padding:9px 12px;margin:3px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.35}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.me{color:var(--ac);font-weight:600}.mu{color:var(--mu);font-size:14px}.tr{min-height:44px;padding:8px;border:1px dashed var(--bd);border-radius:10px}.er{color:var(--ac)}

:root{--bg:#0f2a3d;--fg:#f1e8da;--card:#1d3b52;--ac:#e0565c;--mu:#9db4c4;--bd:#35566f}
body{background:linear-gradient(#0b2233,#164560) fixed}
h1{text-align:center;letter-spacing:1px}
.cd{width:58px;height:86px;flex:none;border-radius:8px;background:#fffdf6;border:2px solid var(--c);color:var(--c);position:relative;padding:0;margin:0;display:inline-block;box-shadow:0 2px 5px #0007}
.cd i{position:absolute;left:5px;top:3px;font:700 15px/1 system-ui}
.cd i.bt{left:auto;right:5px;top:auto;bottom:3px;transform:rotate(180deg)}
.cd b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px}
.cd.sp{background:var(--c);color:#fff;border-color:#fff}.cd.sp i{left:0;right:0;text-align:center;top:5px;font-size:9px}.cd.sp b{top:8px;font-size:32px}
.cd.off{opacity:.4}.cd.lift:not(.off){transform:translateY(-10px)}
.hand{display:flex;overflow-x:auto;padding:16px 6px 8px}.hand .cd+.cd{margin-left:-12px}
.felt{background:radial-gradient(#237a4f,#124a30);border:4px solid #6b4a2b;border-radius:18px;padding:12px;min-height:130px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-start;box-shadow:inset 0 0 30px #0008}
.pl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#fff}.sep{width:1px;align-self:stretch;background:#fff4}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 10px;min-width:70px;text-align:center;font-size:12px;display:flex;flex-direction:column}
.chip b{font-size:14px}.chip em{font-style:normal;color:#f2c14e;font-weight:700}.chip.mm{border-color:#7fb3d5}.chip.on{border-color:#f2c14e;box-shadow:0 0 10px #f2c14e88}
.ban{text-align:center;font-weight:700;margin:10px 0;padding:8px;border-radius:10px;background:#0006}.ban.my{background:#f2c14e;color:#2b2118}
.bb{width:46px;height:46px;border-radius:50%;font-weight:700;font-size:18px}
.code{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;background:#0006;border-radius:14px;padding:10px;margin:8px 0}
.pod{display:flex;justify-content:space-between;background:var(--card);border-radius:10px;padding:10px 14px;margin:6px 0;font-size:17px}
.rm{display:block;width:100%;text-align:left;margin:4px 0}
</style></head><body>
<h1>☠️ Skull King</h1><div id="app"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let me,peer,hc,conns=[],host=false,S=null,code='',msg='';
try{me=localStorage.getItem('skid');if(!me){me=Math.random().toString(36).slice(2,10);localStorage.setItem('skid',me)}}catch(e){me=Math.random().toString(36).slice(2,10)}
const sn={u:'Blau',y:'Gelb',r:'Rot',b:'Schwarz'};
const tcol=s=>isN(s.trump)&&s.trump[0]!='b'?s.trump[0]:'';
const lab=c=>({PI:'🏴‍☠️ Pirat',SK:'💀 Skull King',MM:'🧜‍♀️ Meerjungfrau',ES:'🏳️ Flucht',TG:'🐯 Scary Marie',TP:'🐯 Scary Marie (Pirat)',TE:'🐯 Scary Marie (Flucht)'}[c]||({u:'🔵',y:'🟡',r:'🔴',b:'⚫'}[c[0]]+c.slice(1)));
const isN=c=>/^[uyrb]/.test(c),nm=(s,id)=>(s.players.find(p=>p.id==id)||{}).name;
function deal(s){const d=[];for(const x of'uyrb')for(let v=1;v<=14;v++)d.push(x+v);
 for(let i=0;i<5;i++)d.push('ES','PI');d.push('MM','MM','SK','TG');
 for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 s.hands={};s.bids={};s.tk={};s.bn={};
 s.players.forEach(p=>{s.hands[p.id]=d.splice(0,s.round).sort();s.tk[p.id]=0;s.bn[p.id]=0});
 s.trump=d.pop();s.phase='bid';s.turn=s.lead=(s.round-1)%s.players.length;s.trick=[]}
function win(t,tr){const cs=t.map(x=>({TP:'PI',TE:'ES'}[x.c]||x.c)),f=k=>cs.indexOf(k),n=k=>cs.filter(c=>c==k).length;let w=0,b=0;
 if(f('SK')>=0&&f('MM')>=0){w=f('MM');b=40}
 else if(f('SK')>=0){w=f('SK');b=30*n('PI')}
 else if(f('PI')>=0){w=f('PI');b=20*n('MM')}
 else if(f('MM')>=0)w=f('MM');
 else{const nums=cs.filter(isN);if(nums.length){const s=nums.some(c=>c[0]=='b')?'b':tr&&nums.some(c=>c[0]==tr)?tr:nums[0][0];let best=-1;
  cs.forEach((c,i)=>{if(c[0]==s&&isN(c)&&+c.slice(1)>best){best=+c.slice(1);w=i}})}}
 cs.forEach(c=>{if(isN(c)&&c.slice(1)==14)b+=c[0]=='b'?20:10});return{w,b}}
function ok(s,hand,c){const ls=s.trick.map(x=>x.c).find(isN);return!ls||!isN(c)||c[0]==ls||!hand.some(h=>h[0]==ls)}
function endRound(s){const R=s.round;
 s.players.forEach(p=>{const b=s.bids[p.id],t=s.tk[p.id],g=b==t;
  s.sc[p.id]=(s.sc[p.id]||0)+(b==0?(g?10*R:-10*R):g?20*b+s.bn[p.id]:-10*Math.abs(b-t))});
 if(R>=10){s.phase='end';return}s.round++;deal(s)}
// Host: Spiellogik
function apply(id,m){const s=S,L=s.players.length;
 if(m.t=='join'){if(s.phase=='lobby'&&L<6&&!s.players.some(p=>p.id==id))s.players.push({id,name:String(m.name).slice(0,14)})}
 else if(m.t=='start'){if(s.phase=='lobby'&&L>1){s.round=1;s.sc={};s.last='';deal(s)}}
 else if(m.t=='again'){if(s.phase=='end'){s.phase='lobby';s.sc={}}}
 else if(m.t=='abort'){if(id==me&&s.phase!='lobby'){s.phase='lobby';s.sc={};s.last=''}}
 else if(m.t=='bid'){const p=s.players[s.turn];if(s.phase!='bid'||!p||p.id!=id)return;s.bids[id]=m.n;
  if(Object.keys(s.bids).length==L){s.phase='play';s.turn=s.lead}else s.turn=(s.turn+1)%L}
 else if(m.t=='play'){const p=s.players[s.turn];if(s.phase!='play'||!p||p.id!=id)return;
  const h=s.hands[id],c=h[m.i];if(!c||!ok(s,h,c))return;h.splice(m.i,1);s.trick.push({id,c:c=='TG'?(m.as=='ES'?'TE':'TP'):c});
  if(s.trick.length<L){s.turn=(s.turn+1)%L}
  else{const r=win(s.trick,tcol(s)),w=s.trick[r.w].id;s.tk[w]++;s.bn[w]+=r.b;
   s.last=nm(s,w)+' gewinnt: '+s.trick.map(x=>lab(x.c)).join(' ');
   s.turn=s.lead=s.players.findIndex(q=>q.id==w);s.trick=[];if(!s.hands[w].length)endRound(s)}}
 if(['join','start','again','abort'].includes(m.t))announce();
 render();conns.forEach(c=>c.open&&c.send({t:'s',s:S}))}
const PC={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turns:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]}};
const U='https://ntfy.sh/skullking-lobby-k7x2q9m4';let ROOMS=null,hb;
function announce(){if(!host||!S)return;fetch(U,{method:'POST',body:JSON.stringify({c:code,n:(S.players[0]||{}).name||'?',p:S.players.length,o:S.phase=='lobby'?1:0})}).catch(()=>{})}
addEventListener('pagehide',()=>{if(host)fetch(U,{method:'POST',body:JSON.stringify({c:code,o:0}),keepalive:true}).catch(()=>{})});
async function poll(){if(S||peer)return;try{const tx=await(await fetch(U+'/json?poll=1&since=2m')).text(),now=Date.now()/1000,m={};
 tx.split('\n').filter(Boolean).forEach(l=>{try{const e=JSON.parse(l);if(e.event!='message')return;const d=JSON.parse(e.message);
  if(/^[A-Z]{4}$/.test(d.c)&&(!m[d.c]||m[d.c].time<e.time))m[d.c]={...d,time:e.time}}catch(x){}});
 ROOMS=Object.values(m).filter(d=>d.o==1&&now-d.time<60&&d.c!=code);drawRooms()}catch(e){ROOMS=ROOMS||[];drawRooms()}}
function drawRooms(){const el=$('rooms');if(!el||S)return;
 el.innerHTML=ROOMS===null?'Suche \u2026':ROOMS.length?ROOMS.map(d=>`<button class="rm" onclick="jn('${d.c}')">🏴‍☠️ Raum von ${esc(d.n)} \u00b7 ${d.p} Spieler</button>`).join(''):'Keine offenen R\u00e4ume gefunden.'}
let pick=null;const nope=x=>{msg=x;render();setTimeout(()=>{msg='';render()},2200)};const pk=i=>{pick=i;render()};
const send=m=>{pick=null;return host?apply(me,m):(hc&&hc.open&&hc.send(m))};
const err=e=>{msg=typeof e=='string'?e:(e.type=='peer-unavailable'?'Raum nicht gefunden. Code pr\u00fcfen.':'Verbindungsfehler: '+(e.type||e.message));render()};
const nameVal=()=>($('nm').value||'').trim();
function mk(){const n=nameVal();if(!n){msg='Bitte Namen eingeben.';return render()}
 code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
 peer=new Peer('skullking-'+code,PC);
 peer.on('open',()=>{host=true;S={phase:'lobby',players:[],sc:{}};msg='';apply(me,{t:'join',name:n});hb=setInterval(announce,20000)});
 peer.on('connection',c=>{conns.push(c);c.on('data',m=>{if(m.t=='join')c.pid=m.id;if(c.pid)apply(c.pid,m)});
  c.on('close',()=>{conns=conns.filter(x=>x!=c)})});
 peer.on('error',e=>e.type=='unavailable-id'?mk():err(e))}
function jn(c0){const n=nameVal(),cd=(c0||$('cd').value||'').trim().toUpperCase();
 if(!n||!cd){msg='Name und Raumcode eingeben.';return render()}
 code=cd;msg='Verbinde \u2026';render();peer=new Peer(undefined,PC);setTimeout(()=>{if(!S)err('Keine Verbindung zum Host m\u00f6glich. Pr\u00fcft den Code, probiert dasselbe WLAN oder schaltet bei einem Ger\u00e4t Mobilfunk/VPN aus.')},15000);
 peer.on('open',()=>{hc=peer.connect('skullking-'+cd,{reliable:true});
  hc.on('open',()=>hc.send({t:'join',id:me,name:n}));
  hc.on('data',m=>{if(m.t=='s'){S=m.s;msg='';render()}});
  hc.on('close',()=>err('Verbindung zum Host getrennt.'))});
 peer.on('error',err)}
const SY={u:'💧',y:'☀️',r:'🔥',b:'⚓'},SC={u:'#1f6fd0',y:'#c99700',r:'#c62828',b:'#222'};
function cd(c,o={}){const sp=!isN(c);let top,mid,st;
 if(sp){const m={PI:['🏴‍☠️','Pirat','#8b1a1a'],SK:['💀','Skull King','#111'],MM:['🧜‍♀️','Meerjungfrau','#1b7f86'],ES:['🏳️','Flucht','#6b6b6b'],TG:['🐯','Scary Marie','#b25b00'],TP:['🐯','Marie: Pirat','#8b1a1a'],TE:['🐯','Marie: Flucht','#6b6b6b']}[c];top=m[1];mid=m[0];st=m[2]}
 else{top=c.slice(1);mid=SY[c[0]];st=SC[c[0]]}
 const tg=o.on?'button':'div';
 return `<${tg} class="cd${sp?' sp':''}${o.dis?' off':''}${o.lift?' lift':''}" style="--c:${st}"${o.on?` onclick="${o.on}"`:''}${o.dis&&!o.on?' disabled':''}><i>${top}</i><b>${mid}</b>${sp?'':`<i class="bt">${top}</i>`}</${tg}>`}
function render(){const el=$('app');let h=msg?`<p class="er">${esc(msg)}</p>`:'';
 if(!S){const pre=(location.hash||'').slice(1,5).toUpperCase();
  el.innerHTML=h+`<input id="nm" placeholder="Dein Name" maxlength="14"><h2>Neues Spiel</h2><button class="pri" onclick="mk()">Raum erstellen</button><h2>Mitspielen</h2><input id="cd" placeholder="Raumcode" maxlength="4" value="${esc(pre)}"><button onclick="jn()">Beitreten</button><h2>Offene R\u00e4ume</h2><div id="rooms" class="mu">Suche \u2026</div>`;drawRooms();return}
 const s=S,L=s.players.length,mine=s.players.find(p=>p.id==me),link=location.href.split('#')[0]+'#'+code;
 const chips=f=>'<div class="chips">'+s.players.map((p,i)=>`<div class="chip${p.id==me?' mm':''}${f&&i==s.turn?' on':''}"><b>${esc(p.name)}</b>${f?`<span>Gebot ${s.bids[p.id]??'?'} \u00b7 Stiche ${s.tk[p.id]??0}</span><em>${s.sc[p.id]||0} P.</em>`:''}</div>`).join('')+'</div>';
 if(s.phase=='lobby'){h+=`<p class="mu" style="text-align:center">Raumcode</p><div class="code">${esc(code)}</div><p class="mu" style="text-align:center">Link zum Teilen:<br>${esc(link)}</p>${chips(false)}`;
  if(host)h+=L>1?'<p style="text-align:center"><button class="pri" onclick="send({t:\'start\'})">Spiel starten</button></p>':'<p class="mu" style="text-align:center">Warte auf Mitspieler \u2026</p>';
  else h+='<p class="mu" style="text-align:center">Warte, bis der Host startet \u2026</p>'}
 else if(s.phase=='end'){const r=[...s.players].sort((a,b)=>(s.sc[b.id]||0)-(s.sc[a.id]||0));
  h+=`<h2 style="text-align:center">🏆 ${esc(r[0].name)} gewinnt!</h2>`+r.map((p,i)=>`<div class="pod"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(p.name)}</span><b>${s.sc[p.id]||0} P.</b></div>`).join('')+(host?'<p style="text-align:center"><button class="pri" onclick="send({t:\'again\'})">Zur Lobby</button></p>':'')}
 else{const cur=s.players[s.turn],my=cur&&cur.id==me;if(!my)pick=null;const ls=s.trick.map(x=>x.c).find(isN);
  h+=`<p class="mu" style="text-align:center;margin:0">Runde ${s.round} von 10 \u00b7 ⚓ Schwarz sticht alle Farben \u00b7 ${s.phase=='bid'?'Gebote abgeben':'Stich spielen'}</p>`+chips(true);
  h+=`<div class="felt"><div class="pl">Trumpf${cd(s.trump)}<span>${tcol(s)?sn[tcol(s)]+' sticht':'kein Rundentrumpf'}</span></div><div class="sep"></div>`+
   (s.phase=='play'&&s.trick.length?s.trick.map(x=>`<div class="pl">${cd(x.c)}<span>${esc(nm(s,x.id))}</span></div>`).join(''):`<span class="mu" style="align-self:center">${s.phase=='bid'?'Erst Gebote, dann geht es los':'Noch keine Karte'}</span>`)+'</div>';
  if(s.phase=='play'&&ls)h+=`<p class="mu" style="text-align:center;margin:6px 0 0">Farbe bedienen: <b>${sn[ls[0]]}</b></p>`;
  h+=`<div class="ban${my?' my':''}">${my?'👉 Du bist dran!':esc(cur.name)+' ist dran \u2026'}</div>`;
  if(s.last)h+=`<p class="mu" style="text-align:center">Zuletzt: ${esc(s.last)}</p>`;
  if(mine){if(s.phase=='bid'&&my){h+='<p style="text-align:center;margin:4px">Wie viele Stiche holst du?<br>';for(let n=0;n<=s.round;n++)h+=`<button class="bb" onclick="send({t:'bid',n:${n}})">${n}</button>`;h+='</p>'}
   h+='<div class="hand">'+(s.hands[me]||[]).map((c,i)=>{const pl=s.phase=='play'&&my&&ok(s,s.hands[me],c);return cd(c,{on:!pl?`nope('${s.phase=='bid'?'Erst die Gebote abgeben.':!my?'Du bist nicht dran.':'Du musst die angespielte Farbe bedienen.'}')`:c=='TG'?`pk(${i})`:`send({t:'play',i:${i}})`,dis:!pl,lift:pl})}).join('')+'</div>'+(my&&pick!=null?`<p style="text-align:center">🐯 Scary Marie als: <button onclick="send({t:'play',i:${pick},as:'PI'})">🏴‍☠️ Pirat</button><button onclick="send({t:'play',i:${pick},as:'ES'})">🏳️ Flucht</button></p>`:'')}
  else h+='<p class="mu" style="text-align:center">Du schaust zu.</p>';
  if(host)h+='<p style="text-align:center"><button onclick="if(confirm(\'Spiel wirklich abbrechen?\'))send({t:\'abort\'})">Spiel abbrechen</button></p>'}
 el.innerHTML=h}
render();poll();setInterval(poll,8000);
</script></body></html>
