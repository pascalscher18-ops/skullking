   (s.phase=='play'&&(s.trick.length||s.done)?(s.done?s.done.cards:s.trick).map((x,k,a)=>`<div class="pl${s.done?(x.id==s.done.w?' win':'')+' sweep':(k==a.length-1&&ne!=null?' new'+(x.id==me?' mine':''):'')}" style="--d:${s.done?(2.6-dn).toFixed(2):k==a.length-1&&ne!=null?(-ne).toFixed(2):0}s">${cd(x.c)}<span>${esc(nm(s,x.id))}</span></div>`).join(''):`<span class="mu" style="align-self:center">${s.phase=='bid'?'Erst Gebote, dann geht es los':'Noch keine Karte'}</span>`)+'</div>';
  if(s.phase=='play'&&ls)h+=`<p class="mu" style="text-align:center;margin:6px 0 0">Farbe bedienen: <b>${sn[ls[0]]}</b></p>`;
  {const nf=(s.done?s.done.nf:s.nf)||[];if(nf.length)h+=`<p class="mu" style="text-align:center;margin:4px 0 0">ℹ️ ${nf.map(esc).join(' \u00b7 ')}</p>`}
  h+=`<div class="ban${my&&!s.done?' my':''}">${s.done?'🏆 '+esc(nm(s,s.done.w))+' gewinnt den Stich! <small>(Tippen = weiter)</small>':my?'👉 Du bist dran!':esc(cur.name)+' ist dran \u2026'}</div>`;
  if(s.last)h+=`<p class="mu" style="text-align:center">Zuletzt: ${esc(s.last)}</p>`;
  if(mine){if(s.phase=='bid'&&my){h+='<p style="text-align:center;margin:4px">Wie viele Stiche holst du?<br>';for(let n=0;n<=s.round;n++)h+=`<button class="bb" onclick="send({t:'bid',n:${n}})">${n}</button>`;h+='</p>'}
   h+=hrows(s,my,de)+(my&&pick!=null?`<p style="text-align:center">🐯 Scary Marie als: <button onclick="send({t:'play',i:${pick},as:'PI'})">🏴‍☠️ Pirat</button><button onclick="send({t:'play',i:${pick},as:'ES'})">🏳️ Flucht</button></p>`:'')}
  else h+='<p class="mu" style="text-align:center">Du schaust zu.</p>';
  if(host)h+='<p style="text-align:center"><button onclick="if(confirm(\'Spiel wirklich abbrechen?\'))send({t:\'abort\'})">Spiel abbrechen</button></p>'}
 el.innerHTML=h}
// Piratenmusik (selbst komponiert, per Web Audio erzeugt)
const MEL=[[69,0,65,69,0,74],[72,69,65,69,0,0],[70,0,67,70,0,74],[72,70,69,67,65,0],[74,0,69,74,0,77],[76,72,67,72,0,0],[73,0,69,73,76,69],[74,0,0,69,0,62]];
const BR=[38,38,43,38,38,48,45,38],BF=[45,45,50,45,45,43,52,45];
let AC,mg,mus=false,userOff=false,step=0,nextT=0,mtm;
const hz=m=>440*2**((m-69)/12);
function note(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
 g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.2)}
function snare(t){const n=AC.sampleRate*.12|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);s.connect(g);g.connect(mg);s.start(t)}
function sched(){if(!AC)return;while(nextT<AC.currentTime+1){const bar=Math.floor(step/6)%8,e=step%6,t=nextT,m=MEL[bar][e];
 if(m)note(hz(m),t,.3,'square',.06);
 if(e==0){note(hz(BR[bar]),t,.45,'triangle',.22);kick(t)}
 if(e==3){note(hz(BF[bar]),t,.3,'triangle',.16);snare(t)}
 nextT+=.17;step++}}
function startMusic(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=2600;mg=AC.createGain();mg.gain.value=.5;mg.connect(f);f.connect(AC.destination)}
 AC.resume();nextT=AC.currentTime+.1;clearInterval(mtm);mtm=setInterval(sched,200);sched();mus=true;$('mb').textContent='🎵 Musik an'}catch(e){$('mb').textContent='🔇 nicht m\u00f6glich'}}
function stopMusic(){clearInterval(mtm);mus=false;if(AC&&AC.suspend)AC.suspend();$('mb').textContent='🎵 Musik aus'}
function toggleMusic(){if(mus){userOff=true;stopMusic()}else{userOff=false;startMusic()}}
document.addEventListener('pointerdown',()=>{if(!mus&&!userOff)startMusic()},{once:true});

applyTheme();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
intro();
render();poll();setInterval(poll,8000);
</script></body></html>
